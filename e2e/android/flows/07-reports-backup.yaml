appId: com.lekhawise.app
name: Reports and PDF, reconcile and statement, backup saved to the phone and restored, CSV and Excel (Android)
---
- runFlow: common/fresh-start.yaml

- runFlow: { file: common/open.yaml, env: { PATH_TO: "transaction/new" } }
- extendedWaitUntil: { visible: "Scan a receipt", timeout: 10000 }
- tapOn: "Income"
- tapOn: "Amount"
- inputText: "1000"
- tapOn: "Category"
- scrollUntilVisible: { element: "Salary" }
- tapOn: "Salary"
- scrollUntilVisible: { element: "Bank account" }
- tapOn: "Bank account"
- pressKey: Enter
- scrollUntilVisible: { element: "Save" }
- tapOn: "Save"
- extendedWaitUntil: { notVisible: "Scan a receipt", timeout: 10000 }
- runFlow: { file: common/open.yaml, env: { PATH_TO: "transaction/new" } }
- extendedWaitUntil: { visible: "Scan a receipt", timeout: 10000 }
- inputText: "250"
- tapOn: "Category"
- scrollUntilVisible: { element: "Food & dining" }
- tapOn: "Food & dining"
- scrollUntilVisible: { element: "Cash" }
- tapOn: "Cash"
- pressKey: Enter
- scrollUntilVisible: { element: "Save" }
- tapOn: "Save"
- extendedWaitUntil: { notVisible: "Scan a receipt", timeout: 10000 }

# Reports for the month and the financial year; the PDF opens Android's share sheet
- runFlow: { file: common/open.yaml, env: { PATH_TO: "reports" } }
- extendedWaitUntil: { visible: "Expenses by category", timeout: 10000 }
- assertVisible: "75%"
- tapOn: "Financial year"
- extendedWaitUntil: { visible: "FY .*", timeout: 5000 }
- takeScreenshot: 07-reports-year
- scrollUntilVisible: { element: "Share PDF" }
- tapOn: "Share PDF"
- extendedWaitUntil: { visible: "Sharing 1 file", timeout: 30000 }
- assertVisible: '.*\.pdf'
- takeScreenshot: 07-report-pdf-share-sheet
- back

# Reconcile cash to -300 (it shows -250): an adjustment of -50 is recorded; then the statement
- runFlow: { file: common/open.yaml, env: { PATH_TO: "account/acc_cash" } }
- extendedWaitUntil: { visible: "Reconcile", timeout: 10000 }
- tapOn: "Reconcile"
- extendedWaitUntil: { visible: "Reconcile Cash", timeout: 5000 }
- eraseText: 12
- inputText: "-300"
- tapOn: { text: "Reconcile", index: -1 }
- extendedWaitUntil: { visible: "Reconciled", timeout: 5000 }
- assertVisible: 'A balance adjustment of -\$50\.00 was recorded so the account matches\.'
- tapOn: "OK"
- tapOn: "Statement"
- extendedWaitUntil: { visible: "Closing balance on.*", timeout: 10000 }
- assertVisible: '-\$300\.00'
- takeScreenshot: 07-statement
- scrollUntilVisible: { element: "Share PDF" }
- tapOn: "Share PDF"
- extendedWaitUntil: { visible: "Sharing 1 file", timeout: 30000 }
- back

# Backup saved to the Documents folder on the phone
- runFlow: { file: common/open.yaml, env: { PATH_TO: "backup" } }
- extendedWaitUntil: { visible: "No backup made yet.", timeout: 10000 }
- tapOn: "Save backup to this phone"
- extendedWaitUntil: { visible: "USE THIS FOLDER", timeout: 15000 }
- takeScreenshot: 07-folder-picker
- tapOn: "USE THIS FOLDER"
- runFlow:
    when:
      visible: "ALLOW"
    commands:
      - tapOn: "ALLOW"
- extendedWaitUntil: { visible: 'The file was saved in the folder you chose\.', timeout: 15000 }
- tapOn: "OK"
- extendedWaitUntil: { visible: "Last backup file created: .*", timeout: 10000 }

# More data after the backup ...
- runFlow: { file: common/open.yaml, env: { PATH_TO: "transaction/new" } }
- extendedWaitUntil: { visible: "Scan a receipt", timeout: 10000 }
- inputText: "222"
- tapOn: "Category"
- scrollUntilVisible: { element: "Shopping" }
- tapOn: "Shopping"
- scrollUntilVisible: { element: "Optional" }
- tapOn: "Optional"
- inputText: "Shoes"
- pressKey: Enter
- scrollUntilVisible: { element: "Save" }
- tapOn: "Save"
- extendedWaitUntil: { notVisible: "Scan a receipt", timeout: 10000 }
- runFlow: { file: common/open.yaml, env: { PATH_TO: "transactions" } }
- extendedWaitUntil: { visible: "4 entries", timeout: 10000 }

# ... is gone again after restoring the backup picked with Android's file picker
- runFlow: { file: common/open.yaml, env: { PATH_TO: "backup" } }
- scrollUntilVisible: { element: "Choose backup file" }
- tapOn: "Choose backup file"
- waitForAnimationToEnd: { timeout: 5000 }
- takeScreenshot: 07-file-picker
- runFlow:
    when:
      notVisible: "lekhawise-backup.*"
    commands:
      - tapOn: { text: "Show roots", optional: true }
      - tapOn: { text: "Documents", optional: true }
- tapOn: { text: "lekhawise-backup.*", index: 0 }
- extendedWaitUntil: { visible: "Restore this backup", timeout: 15000 }
- takeScreenshot: 07-restore-preview
- tapOn: "Restore this backup"
- extendedWaitUntil: { visible: 'Replace all data\?', timeout: 5000 }
- tapOn: "REPLACE"
- extendedWaitUntil: { visible: "Restored", timeout: 15000 }
- tapOn: "OK"
- runFlow: { file: common/open.yaml, env: { PATH_TO: "transactions" } }
- extendedWaitUntil: { visible: "3 entries", timeout: 10000 }
- assertNotVisible: ".*Shoes.*"
- takeScreenshot: 07-after-restore

# CSV and Excel exports open the share sheet
- runFlow: { file: common/open.yaml, env: { PATH_TO: "backup" } }
- scrollUntilVisible: { element: "Share CSV" }
- tapOn: "Share CSV"
- extendedWaitUntil: { visible: "Sharing 1 file", timeout: 30000 }
- assertVisible: '.*\.csv'
- takeScreenshot: 07-csv-share-sheet
- back
- scrollUntilVisible: { element: "Share Excel file" }
- tapOn: "Share Excel file"
- extendedWaitUntil: { visible: "Sharing 1 file", timeout: 30000 }
- assertVisible: '.*\.xlsx'
- back
