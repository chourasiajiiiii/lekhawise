appId: com.lekhawise.app
name: Entries, home totals, edit, delete, search, data kept after restart
---
- runFlow: common/fresh-start.yaml
- assertVisible: "No transactions yet"
- takeScreenshot: 01-home-empty

# Income of 1000 into the bank account
- runFlow: { file: common/open.yaml, env: { PATH_TO: "transaction/new" } }
- extendedWaitUntil: { visible: "Scan a receipt", timeout: 10000 }
- takeScreenshot: 01-new-entry
- tapOn: "Income"
- tapOn: "Amount"
- inputText: "1000"
- tapOn: "Category"
- scrollUntilVisible: { element: "Salary" }
- tapOn: "Salary"
- scrollUntilVisible: { element: "Bank account" }
- tapOn: "Bank account"
- pressKey: Enter
- scrollUntilVisible: { element: "Save" }
- tapOn: "Save"
- extendedWaitUntil: { notVisible: "Scan a receipt", timeout: 10000 }

# Expense of 250 with a note
- runFlow: { file: common/open.yaml, env: { PATH_TO: "transaction/new" } }
- extendedWaitUntil: { visible: "Scan a receipt", timeout: 10000 }
- inputText: "250"
- tapOn: "Category"
- scrollUntilVisible: { element: "Food & dining" }
- tapOn: "Food & dining"
# Paid in cash (the form preselects the account used last, which is the bank after the income above)
- scrollUntilVisible: { element: "Cash" }
- tapOn: "Cash"
- scrollUntilVisible: { element: "Optional" }
- tapOn: "Optional"
- inputText: "Lunch"
- pressKey: Enter
- scrollUntilVisible: { element: "Save" }
- tapOn: "Save"
- extendedWaitUntil: { notVisible: "Scan a receipt", timeout: 10000 }

# Home: totals, savings rate, recent list
- assertVisible: "75%"
- assertVisible: "savings rate"
- assertVisible: "Lunch"
- assertVisible: ".*750\\.00.*"
- takeScreenshot: 01-home-totals

# Transfer 300 from the bank to cash
- runFlow: { file: common/open.yaml, env: { PATH_TO: "transaction/new" } }
- extendedWaitUntil: { visible: "Scan a receipt", timeout: 10000 }
- tapOn: "Transfer"
- tapOn: "Amount"
- inputText: "300"
- tapOn: "From"
- tapOn: { text: "Bank account", index: 0 }
- tapOn: { text: "Cash", index: 1 }
- pressKey: Enter
- scrollUntilVisible: { element: "Save" }
- tapOn: "Save"
- extendedWaitUntil: { notVisible: "Scan a receipt", timeout: 10000 }
- runFlow: { file: common/open.yaml, env: { PATH_TO: "accounts" } }
- extendedWaitUntil: { visible: "New account", timeout: 10000 }
# Cash: -250 + 300 = 50; bank: 1000 - 300 = 700
- assertVisible: "\\$50\\.00"
- assertVisible: "\\$700\\.00"
- takeScreenshot: 01-accounts

# Edit the lunch entry from the transactions list
- runFlow: { file: common/open.yaml, env: { PATH_TO: "transactions" } }
- extendedWaitUntil: { visible: "3 entries", timeout: 10000 }
- tapOn: ".*Lunch.*"
- extendedWaitUntil: { visible: "Save changes", timeout: 10000 }
- tapOn: "Amount"
- eraseText: 10
- inputText: "135.50"
- pressKey: Enter
- tapOn: "Save changes"
- extendedWaitUntil: { visible: ".*135\\.50.*", timeout: 10000 }
- takeScreenshot: 01-edited

# Search finds it by amount and by note
- tapOn: "Search notes, categories, tags, amounts"
- inputText: "lunc"
- extendedWaitUntil: { visible: "1 entry", timeout: 10000 }
- assertVisible: "Searching all months"
- eraseText: 10
- extendedWaitUntil: { visible: "3 entries", timeout: 10000 }

# Delete it
- tapOn: ".*Lunch.*"
- extendedWaitUntil: { visible: "Save changes", timeout: 10000 }
- scrollUntilVisible: { element: "Delete" }
- tapOn: "Delete"
- extendedWaitUntil: { visible: "Delete transaction?", timeout: 5000 }
- takeScreenshot: 01-delete-alert
- tapOn: "DELETE"
- extendedWaitUntil: { visible: "2 entries", timeout: 10000 }

# Data is still there after the app is closed and opened again
- stopApp
- launchApp
- extendedWaitUntil: { visible: "Total balance.*", timeout: 30000 }
- runFlow: { file: common/open.yaml, env: { PATH_TO: "transactions" } }
- extendedWaitUntil: { visible: "2 entries", timeout: 10000 }
- takeScreenshot: 01-after-restart
