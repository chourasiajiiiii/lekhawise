appId: com.lekhawise.app
name: Split payment, tags, template, duplicate warning, bill split with friends
---
- runFlow: common/fresh-start.yaml

# One payment of 1000 split across two categories
- runFlow: { file: common/open.yaml, env: { PATH_TO: "transaction/new" } }
- extendedWaitUntil: { visible: "Scan a receipt", timeout: 10000 }
- inputText: "1000"
- tapOn: "Category"
- tapOn: "Split into several categories"
- tapOn: "Category for part 1"
- tapOn: "Groceries"
- tapOn: "Amount for part 1"
- inputText: "700"
- tapOn: "Category for part 2"
- tapOn: "Personal care"
- extendedWaitUntil: { visible: "\\$300\\.00 left to assign", timeout: 5000 }
- tapOn: "Put the rest in the empty part"
- extendedWaitUntil: { visible: "Adds up", timeout: 5000 }
- takeScreenshot: 06-split
- pressKey: Enter
- scrollUntilVisible: { element: "Save" }
- tapOn: "Save"
- extendedWaitUntil: { notVisible: "Scan a receipt", timeout: 10000 }

# A tagged entry, saved as a template, then reused
- runFlow: { file: common/open.yaml, env: { PATH_TO: "transaction/new" } }
- extendedWaitUntil: { visible: "Scan a receipt", timeout: 10000 }
- inputText: "20"
- tapOn: "Category"
- scrollUntilVisible: { element: "Transport" }
- tapOn: "Transport"
- scrollUntilVisible: { element: "New tag" }
- tapOn: "New tag"
- inputText: "Commute"
- pressKey: Enter
- tapOn: { text: "Save", optional: true }
- extendedWaitUntil: { visible: "#Commute", timeout: 5000 }
- scrollUntilVisible: { element: "Optional" }
- tapOn: "Optional"
- inputText: "Metro card"
- scrollUntilVisible: { element: "Save as template" }
- tapOn: "Save as template"
- inputText: "Metro"
- pressKey: Enter
- tapOn: { text: "Save", optional: true }
- extendedWaitUntil: { visible: "Template saved", timeout: 5000 }
- tapOn: "OK"
- pressKey: Enter
- scrollUntilVisible: { element: "Save" }
- tapOn: "Save"
- extendedWaitUntil: { notVisible: "Scan a receipt", timeout: 10000 }

# The template fills the form; saving the same again warns about a duplicate
- runFlow: { file: common/open.yaml, env: { PATH_TO: "transaction/new" } }
- extendedWaitUntil: { visible: "Metro", timeout: 10000 }
- tapOn: "Metro"
- assertVisible: "Metro card"
- takeScreenshot: 06-template-applied
- pressKey: Enter
- scrollUntilVisible: { element: "Save" }
- tapOn: "Save"
- extendedWaitUntil: { visible: "Possible duplicate", timeout: 5000 }
- takeScreenshot: 06-duplicate-warning
- tapOn: "Save anyway"
- extendedWaitUntil: { visible: "Total balance.*", timeout: 10000 }
- runFlow: { file: common/open.yaml, env: { PATH_TO: "transactions" } }
- extendedWaitUntil: { visible: "3 entries", timeout: 10000 }
- tapOn: "#Commute"
- extendedWaitUntil: { visible: "1 entry", timeout: 5000 }
- runFlow: { file: common/open.yaml, env: { PATH_TO: "duplicates" } }
- tapOn: "Keep one, delete the rest"
- tapOn: "Delete"
- extendedWaitUntil: { visible: "No duplicates found", timeout: 10000 }

# A dinner of 900 split equally with two friends
- runFlow: { file: common/open.yaml, env: { PATH_TO: "transaction/new" } }
- extendedWaitUntil: { visible: "Scan a receipt", timeout: 10000 }
- inputText: "900"
- tapOn: "Category"
- scrollUntilVisible: { element: "Food & dining" }
- tapOn: "Food & dining"
- scrollUntilVisible: { element: "Others owe me part of this" }
- tapOn: "Others owe me part of this"
- scrollUntilVisible: { element: "Add person" }
- tapOn: { text: "Name", index: 0 }
- inputText: "Asha"
- pressKey: Enter
- scrollUntilVisible: { element: "Add person" }
- tapOn: "Add person"
- scrollUntilVisible: { element: "Add person" }
- tapOn: { text: "Name", index: 1 }
- inputText: "Ben"
- pressKey: Enter
- scrollUntilVisible: { element: "Split equally" }
- tapOn: "Split equally"
- extendedWaitUntil: { visible: "Your share: \\$300\\.00", timeout: 5000 }
- takeScreenshot: 06-bill-split
- pressKey: Enter
- scrollUntilVisible: { element: "Save" }
- tapOn: "Save"
- extendedWaitUntil: { notVisible: "Scan a receipt", timeout: 10000 }
- runFlow: { file: common/open.yaml, env: { PATH_TO: "loans" } }
- extendedWaitUntil: { visible: "Asha", timeout: 10000 }
- assertVisible: "Ben"
- assertVisible: "\\$600\\.00"
- takeScreenshot: 06-owed
