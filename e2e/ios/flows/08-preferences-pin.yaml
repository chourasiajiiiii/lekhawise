appId: com.lekhawise.app
name: Hindi, dark theme, currency, app PIN with relock and wrong attempts
---
- runFlow: common/fresh-start.yaml

# Hindi, then back to English
- runFlow: { file: common/open.yaml, env: { PATH_TO: "language" } }
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?हिन्दी(, .*)?' } }
- tapOn: '(?s)(.*, )?हिन्दी(, .*)?'
- runFlow: { file: common/open.yaml, env: { PATH_TO: "" } }
- extendedWaitUntil: { visible: '(?s)(.*, )?कुल बैलेंस.*(, .*)?', timeout: 10000 }
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?अधिक(, .*)?' } }
- takeScreenshot: 08-hindi
- runFlow: { file: common/open.yaml, env: { PATH_TO: "language" } }
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?English(, .*)?' } }
- tapOn: '(?s)(.*, )?English(, .*)?'
- runFlow: { file: common/open.yaml, env: { PATH_TO: "" } }
- extendedWaitUntil: { visible: '(?s)(.*, )?Total balance.*(, .*)?', timeout: 10000 }

# Dark theme and Indian rupees
- runFlow: { file: common/open.yaml, env: { PATH_TO: "settings" } }
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Dark(, .*)?' } }
- tapOn: '(?s)(.*, )?Dark(, .*)?'
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Currency(, .*)?' } }
- tapOn: '(?s)(.*, )?Currency(, .*)?'
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Search currency(, .*)?' } }
- tapOn: '(?s)(.*, )?Search currency(, .*)?'
- waitForAnimationToEnd: { timeout: 2000 }
- inputText: "rupee"
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?INR · Indian rupee(, .*)?' } }
- tapOn: '(?s)(.*, )?INR · Indian rupee(, .*)?'
- runFlow: { file: common/open.yaml, env: { PATH_TO: "" } }
- extendedWaitUntil: { visible: '(?s)(.*, )?₹0\.00(, .*)?', timeout: 10000 }
- takeScreenshot: 08-dark-inr

# App PIN
- runFlow: { file: common/open.yaml, env: { PATH_TO: "security" } }
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?App PIN(, .*)?' } }
- tapOn: '(?s)(.*, )?App PIN(, .*)?'
- extendedWaitUntil: { visible: '(?s)(.*, )?Choose a PIN \(4 to 6 digits\)(, .*)?', timeout: 5000 }
- tapOn: "1"
- tapOn: "3"
- tapOn: "5"
- tapOn: "7"
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Continue(, .*)?' } }
- tapOn: '(?s)(.*, )?Continue(, .*)?'
- extendedWaitUntil: { visible: '(?s)(.*, )?Enter the new PIN again(, .*)?', timeout: 5000 }
- tapOn: "1"
- tapOn: "3"
- tapOn: "5"
- tapOn: "7"
- extendedWaitUntil: { visible: '(?s)(.*, )?PIN saved(, .*)?', timeout: 5000 }
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?OK(, .*)?' } }
- tapOn: '(?s)(.*, )?OK(, .*)?'

# Next start: locked until the PIN is entered; a wrong PIN is refused
- stopApp
- launchApp
- extendedWaitUntil: { visible: '(?s)(.*, )?Enter your PIN(, .*)?', timeout: 30000 }
- takeScreenshot: 08-pin-lock
- tapOn: "0"
- tapOn: "0"
- tapOn: "0"
- tapOn: "0"
- extendedWaitUntil: { visible: '(?s)(.*, )?Wrong PIN\. 4 attempts left before a pause\.(, .*)?', timeout: 5000 }
- tapOn: "1"
- tapOn: "3"
- tapOn: "5"
- tapOn: "7"
- extendedWaitUntil: { visible: '(?s)(.*, )?Total balance.*(, .*)?', timeout: 10000 }
- takeScreenshot: 08-unlocked
