appId: com.lekhawise.app
name: Loan with EMI and repayment, savings goal, investment, net worth
---
- runFlow: common/fresh-start.yaml

# Loan of 100,000 at 12% over 12 months
- runFlow: { file: common/open.yaml, env: { PATH_TO: "loans/new" } }
- extendedWaitUntil: { visible: '(?s)(.*, )?Interest % a year(, .*)?', timeout: 10000 }
- inputText: "Car loan"
- tapOn: "Amount"
- waitForAnimationToEnd: { timeout: 2000 }
- inputText: "100000"
- tapOn: "Interest % a year"
- waitForAnimationToEnd: { timeout: 2000 }
- inputText: "12"
- tapOn: "Months"
- waitForAnimationToEnd: { timeout: 2000 }
- inputText: "12"
- runFlow: common/no-keyboard.yaml
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Worked out EMI: \$8,884\.88 for 12 months at 12%.*(, .*)?' } }
- takeScreenshot: 05-loan-form
- scrollUntilVisible: { element: '(?s)(.*, )?Bank account(, .*)?' }
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: '(?s)(.*, )?Bank account(, .*)?'
- runFlow: common/save.yaml
- extendedWaitUntil: { visible: '(?s)(.*, )?You still owe(, .*)?', timeout: 10000 }
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Total interest over the loan(, .*)?' } }
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Record a repayment(, .*)?' } }
- tapOn: '(?s)(.*, )?Record a repayment(, .*)?'
- extendedWaitUntil: { visible: '(?s)(.*, )?Reduces the loan by \$7,884\.88(, .*)?', timeout: 5000 }
- scrollUntilVisible: { element: '(?s)(.*, )?Bank account(, .*)?' }
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: '(?s)(.*, )?Bank account(, .*)?'
- runFlow: common/save.yaml
- extendedWaitUntil: { visible: '(?s)(.*, )?\$92,115\.12(, .*)?', timeout: 10000 }
- takeScreenshot: 05-loan-after-repayment

# Savings goal of 50,000: add 5,000, take out 1,000
- runFlow: { file: common/open.yaml, env: { PATH_TO: "goals/new" } }
- extendedWaitUntil: { visible: '(?s)(.*, )?Target amount(, .*)?', timeout: 10000 }
- inputText: "Trip"
- tapOn: "Target amount"
- waitForAnimationToEnd: { timeout: 2000 }
- inputText: "50000"
- runFlow: common/save.yaml
- extendedWaitUntil: { visible: '(?s)(.*, )?of \$50,000\.00(, .*)?', timeout: 10000 }
- tapOn: "Amount"
- waitForAnimationToEnd: { timeout: 2000 }
- inputText: "5000"
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Add to goal(, .*)?' } }
- tapOn: '(?s)(.*, )?Add to goal(, .*)?'
- extendedWaitUntil: { visible: '(?s)(.*, )?\$5,000\.00(, .*)?', timeout: 5000 }
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Take money out(, .*)?' } }
- tapOn: '(?s)(.*, )?Take money out(, .*)?'
- tapOn: "Amount"
- waitForAnimationToEnd: { timeout: 2000 }
- inputText: "1000"
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Take out of goal(, .*)?' } }
- tapOn: '(?s)(.*, )?Take out of goal(, .*)?'
- extendedWaitUntil: { visible: '(?s)(.*, )?\$46,000\.00 to go(, .*)?', timeout: 5000 }
- takeScreenshot: 05-goal

# Investment of 40,000 now worth 46,000, then 50,000
- runFlow: { file: common/open.yaml, env: { PATH_TO: "holding/new?kind=investment" } }
- extendedWaitUntil: { visible: '(?s)(.*, )?Amount invested(, .*)?', timeout: 10000 }
- inputText: "Index fund"
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Mutual funds(, .*)?' } }
- tapOn: '(?s)(.*, )?Mutual funds(, .*)?'
- tapOn: "Amount invested"
- waitForAnimationToEnd: { timeout: 2000 }
- inputText: "40000"
- tapOn: "Current value \\(leave empty if the same\\)"
- waitForAnimationToEnd: { timeout: 2000 }
- inputText: "46000"
- runFlow: common/save.yaml
- extendedWaitUntil: { visible: '(?s)(.*, )?\$46,000\.00(, .*)?', timeout: 10000 }
- tapOn: "New value"
- waitForAnimationToEnd: { timeout: 2000 }
- inputText: "50000"
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Save value(, .*)?' } }
- tapOn: '(?s)(.*, )?Save value(, .*)?'
- extendedWaitUntil: { visible: '(?s)(.*, )?\$50,000\.00(, .*)?', timeout: 5000 }
- takeScreenshot: 05-investment

# Net worth: bank 91,115.12 (loan paid in, one repayment out) + investment 50,000 - loan 92,115.12 = 49,000
- runFlow: { file: common/open.yaml, env: { PATH_TO: "networth" } }
- extendedWaitUntil: { visible: '(?s)(.*, )?What you own(, .*)?', timeout: 10000 }
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?\$49,000\.00(, .*)?' } }
- takeScreenshot: 05-networth
