appId: com.lekhawise.app
name: Home-screen widget added from the widget gallery (best effort; the home screen differs between iOS versions)
---
# Expects data from an earlier flow; opening the app refreshes the widget.
- launchApp
- extendedWaitUntil: { visible: '(?s)(.*, )?Total balance.*(, .*)?', timeout: 30000 }
- pressKey: Home
- waitForAnimationToEnd: { timeout: 3000 }
# iOS 26: long-press an app icon and choose Edit Home Screen (a long press on the wallpaper does nothing
# under Maestro); older versions go straight into edit mode.
- longPressOn: "LekhaWise"
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: { text: "Edit Home Screen", optional: true }
- waitForAnimationToEnd: { timeout: 3000 }
- takeScreenshot: 10-home-edit-mode
- tapOn: { text: '(?s)(.*, )?Edit(, .*)?', optional: true }
- tapOn: { text: '(?s)(.*, )?Add Widget(, .*)?', optional: true }
- tapOn: { text: '(?s)(.*, )?Add widget(, .*)?', optional: true }
- waitForAnimationToEnd: { timeout: 3000 }
- takeScreenshot: 10-widget-gallery
- tapOn: { text: '(?s)(.*, )?Search Widgets(, .*)?', optional: true }
- inputText: "LekhaWise"
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: { text: "LekhaWise", index: 0 }
- waitForAnimationToEnd: { timeout: 3000 }
- takeScreenshot: 10-widget-preview
- tapOn: '(?s)(.*, )?Add Widget(, .*)?'
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: { text: '(?s)(.*, )?Done(, .*)?', optional: true }
- waitForAnimationToEnd: { timeout: 5000 }
- takeScreenshot: 10-widget-on-home-screen
- assertVisible: ".*Spent today.*"
