appId: com.lekhawise.app
name: Entries, home totals, edit, delete, search, data kept after restart
---
- runFlow: common/fresh-start.yaml
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?No transactions yet(, .*)?' } }
- takeScreenshot: 01-home-empty

# Income of 1000 into the bank account
- runFlow: { file: common/open.yaml, env: { PATH_TO: "transaction/new" } }
- extendedWaitUntil: { visible: '(?s)(.*, )?Scan a receipt(, .*)?', timeout: 30000 }
- takeScreenshot: 01-new-entry
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Income(, .*)?' } }
- tapOn: '(?s)(.*, )?Income(, .*)?'
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Amount(, .*)?' } }
- tapOn: '(?s)(.*, )?Amount(, .*)?'
- waitForAnimationToEnd: { timeout: 2000 }
- inputText: "1000"
- runFlow: common/no-keyboard.yaml
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Category(, .*)?' } }
- tapOn: '(?s)(.*, )?Category(, .*)?'
- scrollUntilVisible: { element: '(?s)(.*, )?Salary(, .*)?' }
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: '(?s)(.*, )?Salary(, .*)?'
- scrollUntilVisible: { element: '(?s)(.*, )?Bank account(, .*)?' }
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: '(?s)(.*, )?Bank account(, .*)?'
- runFlow: common/save.yaml
- extendedWaitUntil: { notVisible: '(?s)(.*, )?(New|Edit) transaction(, .*)?', timeout: 20000 }

# Expense of 250 with a note
- runFlow: { file: common/open.yaml, env: { PATH_TO: "transaction/new" } }
- extendedWaitUntil: { visible: '(?s)(.*, )?Scan a receipt(, .*)?', timeout: 30000 }
- runFlow: { file: common/type-amount.yaml, env: { AMOUNT: "250" } }
- runFlow: common/no-keyboard.yaml
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Category(, .*)?' } }
- tapOn: '(?s)(.*, )?Category(, .*)?'
- scrollUntilVisible: { element: '(?s)(.*, )?Food & dining(, .*)?' }
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: '(?s)(.*, )?Food & dining(, .*)?'
# Paid in cash (the form preselects the account used last, which is the bank after the income above)
- scrollUntilVisible: { element: '(?s)(.*, )?Cash(, .*)?' }
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: '(?s)(.*, )?Cash(, .*)?'
- scrollUntilVisible: { element: '(?s)(.*, )?Optional(, .*)?' }
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: '(?s)(.*, )?Optional(, .*)?'
- waitForAnimationToEnd: { timeout: 2000 }
- inputText: "Lunch"
- runFlow: common/save.yaml
- extendedWaitUntil: { notVisible: '(?s)(.*, )?(New|Edit) transaction(, .*)?', timeout: 20000 }

# Home: totals, savings rate, recent list
- runFlow: { file: common/find-above.yaml, env: { TEXT: '(?s)(.*, )?75%(, .*)?' } }
- runFlow: { file: common/find-above.yaml, env: { TEXT: '(?s)(.*, )?savings rate(, .*)?' } }
- runFlow: { file: common/find-above.yaml, env: { TEXT: ".*750\\.00.*" } }
- takeScreenshot: 01-home-totals
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Lunch(, .*)?' } }

# Transfer 300 from the bank to cash
- runFlow: { file: common/open.yaml, env: { PATH_TO: "transaction/new" } }
- extendedWaitUntil: { visible: '(?s)(.*, )?Scan a receipt(, .*)?', timeout: 30000 }
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Transfer(, .*)?' } }
- tapOn: '(?s)(.*, )?Transfer(, .*)?'
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Amount(, .*)?' } }
- tapOn: '(?s)(.*, )?Amount(, .*)?'
- waitForAnimationToEnd: { timeout: 2000 }
- inputText: "300"
- runFlow: common/no-keyboard.yaml
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?From(, .*)?' } }
- tapOn: '(?s)(.*, )?From(, .*)?'
- tapOn: { text: "Bank account", index: 0 }
- tapOn: { text: "Cash", index: 1 }
- runFlow: common/save.yaml
- extendedWaitUntil: { notVisible: '(?s)(.*, )?(New|Edit) transaction(, .*)?', timeout: 20000 }
- runFlow: { file: common/open.yaml, env: { PATH_TO: "accounts" } }
- extendedWaitUntil: { visible: '(?s)(.*, )?New account(, .*)?', timeout: 10000 }
# Cash: -250 + 300 = 50; bank: 1000 - 300 = 700
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?\$50\.00(, .*)?' } }
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?\$700\.00(, .*)?' } }
- takeScreenshot: 01-accounts

# Edit the lunch entry from the transactions list
- runFlow: { file: common/open.yaml, env: { PATH_TO: "transactions" } }
- extendedWaitUntil: { visible: '(?s)(.*, )?3 entries(, .*)?', timeout: 10000 }
- tapOn: ".*Lunch.*"
- extendedWaitUntil: { visible: '(?s)(.*, )?Edit transaction(, .*)?', timeout: 10000 }
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Amount(, .*)?' } }
- tapOn: '(?s)(.*, )?Amount(, .*)?'
- eraseText: 10
- inputText: "135.50"
# Typing into the field sometimes does not arrive on iOS 26; type again when the new amount is not in it
- runFlow:
    when: { notVisible: ".*135\\.50.*" }
    commands:
      - tapOn: '(?s)(.*, )?Amount(, .*)?'
      - waitForAnimationToEnd: { timeout: 2000 }
      - eraseText: 12
      - inputText: "135.50"
- extendedWaitUntil: { visible: ".*135\\.50.*", timeout: 5000 }
- runFlow: common/no-keyboard.yaml
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Save changes(, .*)?' } }
- tapOn: '(?s)(.*, )?Save changes(, .*)?'
- extendedWaitUntil: { visible: ".*135\\.50.*", timeout: 10000 }
- takeScreenshot: 01-edited

# Search finds it by amount and by note
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Search notes, categories, tags, amounts(, .*)?' } }
- tapOn: '(?s)(.*, )?Search notes, categories, tags, amounts(, .*)?'
- waitForAnimationToEnd: { timeout: 2000 }
- inputText: "lunc"
- extendedWaitUntil: { visible: '(?s)(.*, )?1 entry(, .*)?', timeout: 10000 }
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Searching all months(, .*)?' } }
# The field's own clear button; erasing key by key lets iOS autocorrect put a word back
- tapOn: { text: "Clear text", optional: true }
- runFlow:
    when: { visible: '(?s)(.*, )?Searching all months(, .*)?' }
    commands:
      - eraseText: 20
- extendedWaitUntil: { visible: '(?s)(.*, )?3 entries(, .*)?', timeout: 10000 }

# Delete it (the Search key closes the keyboard, which covers the list)
- pressKey: Enter
- waitForAnimationToEnd: { timeout: 2000 }
- runFlow: { file: common/find.yaml, env: { TEXT: ".*Lunch.*" } }
- tapOn: ".*Lunch.*"
- extendedWaitUntil: { visible: '(?s)(.*, )?Edit transaction(, .*)?', timeout: 10000 }
- scrollUntilVisible: { element: '(?s)(.*, )?Delete(, .*)?' }
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: '(?s)(.*, )?Delete(, .*)?'
- extendedWaitUntil: { visible: '(?s)(.*, )?Delete transaction\?(, .*)?', timeout: 5000 }
- takeScreenshot: 01-delete-alert
- tapOn: { text: "Delete", index: 1 }
- extendedWaitUntil: { visible: '(?s)(.*, )?2 entries(, .*)?', timeout: 10000 }

# Data is still there after the app is closed and opened again
- stopApp
- launchApp
- extendedWaitUntil: { visible: '(?s)(.*, )?Total balance.*(, .*)?', timeout: 30000 }
- runFlow: { file: common/open.yaml, env: { PATH_TO: "transactions" } }
- extendedWaitUntil: { visible: '(?s)(.*, )?2 entries(, .*)?', timeout: 10000 }
- takeScreenshot: 01-after-restart
