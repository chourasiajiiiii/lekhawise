appId: com.lekhawise.app
name: Receipt scanning from the photo library (upright photo)
---
- runFlow: common/fresh-start.yaml
- runFlow: { file: common/open.yaml, env: { PATH_TO: "transaction/new" } }
- extendedWaitUntil: { visible: '(?s)(.*, )?Scan a receipt(, .*)?', timeout: 10000 }
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Scan a receipt(, .*)?' } }
- tapOn: '(?s)(.*, )?Scan a receipt(, .*)?'
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Choose from gallery(, .*)?' } }
- tapOn: '(?s)(.*, )?Choose from gallery(, .*)?'
- takeScreenshot: 02-photo-picker
- runFlow: common/pick-newest-photo.yaml
- extendedWaitUntil: { visible: '(?s)(.*, )?Receipt read(, .*)?', timeout: 60000 }
- takeScreenshot: 02-receipt-read
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Check the amount, date and note, then choose a category\.(, .*)?' } }
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?OK(, .*)?' } }
- tapOn: '(?s)(.*, )?OK(, .*)?'
# The form fields (checked again in the saved entry below)
- assertVisible: { text: '(?s)(.*, )?32\.25(, .*)?', optional: true }
- assertVisible: { text: '(?s)(.*, )?HARBOR FRESH MARKET(, .*)?', optional: true }
- takeScreenshot: 02-form-filled
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Category(, .*)?' } }
- tapOn: '(?s)(.*, )?Category(, .*)?'
- scrollUntilVisible: { element: '(?s)(.*, )?Groceries(, .*)?' }
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: '(?s)(.*, )?Groceries(, .*)?'
- scrollUntilVisible: { element: '(?s)(.*, )?Save(, .*)?' }
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: '(?s)(.*, )?Save(, .*)?'
- extendedWaitUntil: { notVisible: '(?s)(.*, )?(New|Edit) transaction(, .*)?', timeout: 10000 }
- runFlow: { file: common/open.yaml, env: { PATH_TO: "transactions" } }
- extendedWaitUntil: { visible: '(?s)(.*, )?1 entry(, .*)?', timeout: 10000 }
- assertVisible: ".*HARBOR FRESH MARKET.*"
- assertVisible: '.*32\.25.*'
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Has a photo(, .*)?' } }
- takeScreenshot: 02-saved
