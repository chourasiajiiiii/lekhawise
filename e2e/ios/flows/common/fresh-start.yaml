# Starts the app as if just installed: no data, no saved encryption key, every permission granted.
appId: com.lekhawise.app
---
- clearKeychain
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: '(?s)(.*, )?Total balance.*(, .*)?'
    timeout: 60000
    optional: true
# A late "Open in LekhaWise?" prompt from an earlier link stays on screen across launches and hides the app.
- runFlow:
    when:
      visible: '(?s)(.*, )?Open in .*(, .*)?'
    commands:
      - tapOn: '(?s)(.*, )?Cancel(, .*)?'
      - waitForAnimationToEnd:
          timeout: 2000
- extendedWaitUntil:
    visible: '(?s)(.*, )?Total balance.*(, .*)?'
    timeout: 30000
