# Opens one link before the flows start. The first link after the app is installed makes iOS ask "Open in
# LekhaWise?", and that prompt or the link it lets through can take more than a minute to arrive; later links
# open at once.
appId: com.lekhawise.app
---
- runFlow: fresh-start.yaml
- runFlow: { file: open.yaml, env: { PATH_TO: "settings" } }
- repeat:
    times: 6
    while:
      notVisible: '(?s)(.*, )?Net worth(, .*)?'
    commands:
      - extendedWaitUntil:
          visible: '(?s)(.*, )?(Net worth|Open in .*)(, .*)?'
          timeout: 20000
          optional: true
      - runFlow:
          when:
            visible: '(?s)(.*, )?Open in .*(, .*)?'
          commands:
            - tapOn: '(?s)(.*, )?Open(, .*)?'
            - waitForAnimationToEnd:
                timeout: 3000
- extendedWaitUntil:
    visible: '(?s)(.*, )?Net worth(, .*)?'
    timeout: 30000
