# In Apple's photo picker, taps the newest photo (the simulator also holds sample photos). The iOS 26 grid
# (thumbnails with id PXGGridLayout-Info) lists the newest first; the older layout ("Photo, <date>") lists it last.
appId: com.lekhawise.app
---
- extendedWaitUntil:
    visible: { id: "PXGGridLayout-Info" }
    timeout: 15000
    optional: true
- evalScript: ${output.photoIndex = -1}
- runFlow:
    when:
      visible: { id: "PXGGridLayout-Info" }
    commands:
      - evalScript: ${output.photoIndex = 0}
      - tapOn: { id: "PXGGridLayout-Info", index: 0 }
# Older picker layout: thumbnails labelled "Photo, <date>".
- runFlow:
    when:
      true: ${output.photoIndex < 0}
      visible: '(?s)(.*, )?Photo, .*(, .*)?'
    commands:
      - evalScript: ${output.photoDone = false}
      - repeat:
          while:
            true: ${!output.photoDone}
          commands:
            - runFlow:
                when:
                  visible: { text: "Photo, .*", index: "${output.photoIndex + 1}" }
                commands:
                  - evalScript: ${output.photoIndex = output.photoIndex + 1}
            - runFlow:
                when:
                  notVisible: { text: "Photo, .*", index: "${output.photoIndex + 1}" }
                commands:
                  - evalScript: ${output.photoDone = true}
      - tapOn: { text: "Photo, .*", index: "${output.photoIndex}" }
# iOS 26: the picker runs in its own process and shows nothing in the screen tree. Newest photos come first, so the
# newest is the top-left thumbnail.
- runFlow:
    when:
      true: ${output.photoIndex < 0}
      notVisible: '(?s)(.*, )?Photo, .*(, .*)?'
    commands:
      - waitForAnimationToEnd: { timeout: 3000 }
      - tapOn: { point: "16%,25%" }
      # A tap that comes while the picker is still loading is lost; a second one then picks the photo. If the first
      # one worked, the picker is gone and this lands on the form's Expense switch, which is already selected.
      - extendedWaitUntil:
          visible: '(?s)(.*, )?Receipt read(, .*)?'
          timeout: 15000
          optional: true
      - runFlow:
          when:
            notVisible: '(?s)(.*, )?Receipt read(, .*)?'
          commands:
            - tapOn: { point: "16%,25%" }
