appId: com.lekhawise.app
name: Budgets (monthly by category, weekly overall, alert, carry-forward) and recurring entries
---
- runFlow: common/fresh-start.yaml

# Monthly budget of 1000 for Food & dining
- runFlow: { file: common/open.yaml, env: { PATH_TO: "budgets" } }
- extendedWaitUntil: { visible: '(?s)(.*, )?Set a budget(, .*)?', timeout: 10000 }
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Food & dining(, .*)?' } }
- tapOn: '(?s)(.*, )?Food & dining(, .*)?'
- extendedWaitUntil: { visible: '(?s)(.*, )?Monthly budget: Food & dining(, .*)?', timeout: 10000, optional: true }
# A tap that comes while the list is still settling is lost; the row is tapped again then.
- runFlow:
    when:
      notVisible: '(?s)(.*, )?Monthly budget: Food & dining(, .*)?'
    commands:
      - tapOn: '(?s)(.*, )?Food & dining(, .*)?'
- extendedWaitUntil: { visible: '(?s)(.*, )?Monthly budget: Food & dining(, .*)?', timeout: 10000 }
- inputText: "1000"
- takeScreenshot: 04-budget-dialog-keyboard
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Save(, .*)?' } }
- tapOn: '(?s)(.*, )?Save(, .*)?'
- extendedWaitUntil: { visible: '(?s)(.*, )?By category(, .*)?', timeout: 5000 }
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?\$0\.00 of \$1,000\.00(, .*)?' } }

# Spending 700 then 400 goes over it, with an alert
- runFlow: { file: common/open.yaml, env: { PATH_TO: "transaction/new" } }
- extendedWaitUntil: { visible: '(?s)(.*, )?Scan a receipt(, .*)?', timeout: 30000 }
- runFlow: { file: common/type-amount.yaml, env: { AMOUNT: "700" } }
- runFlow: common/no-keyboard.yaml
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Category(, .*)?' } }
- tapOn: '(?s)(.*, )?Category(, .*)?'
- scrollUntilVisible: { element: '(?s)(.*, )?Food & dining(, .*)?' }
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: '(?s)(.*, )?Food & dining(, .*)?'
- runFlow: common/save.yaml
- extendedWaitUntil: { notVisible: '(?s)(.*, )?(New|Edit) transaction(, .*)?', timeout: 20000 }
- runFlow: { file: common/open.yaml, env: { PATH_TO: "transaction/new" } }
- extendedWaitUntil: { visible: '(?s)(.*, )?Scan a receipt(, .*)?', timeout: 30000 }
- runFlow: { file: common/type-amount.yaml, env: { AMOUNT: "400" } }
- runFlow: common/no-keyboard.yaml
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Category(, .*)?' } }
- tapOn: '(?s)(.*, )?Category(, .*)?'
- scrollUntilVisible: { element: '(?s)(.*, )?Food & dining(, .*)?' }
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: '(?s)(.*, )?Food & dining(, .*)?'
- runFlow: common/save.yaml
- extendedWaitUntil: { visible: '(?s)(.*, )?Over budget: Food & dining(, .*)?', timeout: 10000 }
- takeScreenshot: 04-over-budget-alert
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?OK(, .*)?' } }
- tapOn: '(?s)(.*, )?OK(, .*)?'
- runFlow: { file: common/open.yaml, env: { PATH_TO: "budgets" } }
- extendedWaitUntil: { visible: '(?s)(.*, )?\$100\.00 over(, .*)?', timeout: 10000 }
- takeScreenshot: 04-budgets-month

# Weekly overall limit of 500 with carry-forward
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Weekly(, .*)?' } }
- tapOn: '(?s)(.*, )?Weekly(, .*)?'
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Set a weekly spending limit(, .*)?' } }
- tapOn: '(?s)(.*, )?Set a weekly spending limit(, .*)?'
- waitForAnimationToEnd: { timeout: 2000 }
- inputText: "500"
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Save(, .*)?' } }
- tapOn: '(?s)(.*, )?Save(, .*)?'
- extendedWaitUntil: { visible: '(?s)(.*, )?\$1,100\.00 of \$500\.00(, .*)?', timeout: 5000 }
- tapOn: '(?s)All spending, .*'
- extendedWaitUntil: { visible: '(?s)(.*, )?over budget(, .*)?', timeout: 5000 }
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?\$600\.00(, .*)?' } }
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Carry unspent money forward(, .*)?' } }
- tapOn: '(?s)(.*, )?Carry unspent money forward(, .*)?'
- takeScreenshot: 04-weekly-budget

# A monthly recurring entry
- runFlow: { file: common/open.yaml, env: { PATH_TO: "transaction/new" } }
- extendedWaitUntil: { visible: '(?s)(.*, )?Scan a receipt(, .*)?', timeout: 30000 }
- runFlow: { file: common/type-amount.yaml, env: { AMOUNT: "15" } }
- runFlow: common/no-keyboard.yaml
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Category(, .*)?' } }
- tapOn: '(?s)(.*, )?Category(, .*)?'
- scrollUntilVisible: { element: '(?s)(.*, )?Entertainment(, .*)?' }
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: '(?s)(.*, )?Entertainment(, .*)?'
- scrollUntilVisible: { element: '(?s)(.*, )?Optional(, .*)?' }
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: '(?s)(.*, )?Optional(, .*)?'
- waitForAnimationToEnd: { timeout: 2000 }
- inputText: "Streaming"
- runFlow: common/no-keyboard.yaml
- scrollUntilVisible: { element: '(?s)(.*, )?Monthly(, .*)?' }
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: '(?s)(.*, )?Monthly(, .*)?'
- runFlow: common/save.yaml
- runFlow:
    when:
      visible: '(?s)(.*, )?OK(, .*)?'
    commands:
      - runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?OK(, .*)?' } }
      - tapOn: '(?s)(.*, )?OK(, .*)?'
- extendedWaitUntil: { notVisible: '(?s)(.*, )?(New|Edit) transaction(, .*)?', timeout: 20000 }
- runFlow: { file: common/open.yaml, env: { PATH_TO: "recurring" } }
- extendedWaitUntil: { visible: '(?s)(.*, )?Streaming(, .*)?', timeout: 10000 }
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Monthly · next.*(, .*)?' } }
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Streaming(, .*)?' } }
- tapOn: '(?s)(.*, )?Streaming(, .*)?'
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Pause(, .*)?' } }
- tapOn: '(?s)(.*, )?Pause(, .*)?'
- extendedWaitUntil: { visible: '(?s)(.*, )?Paused(, .*)?', timeout: 5000 }
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Resume \(adds any missed entries\)(, .*)?' } }
- tapOn: '(?s)(.*, )?Resume \(adds any missed entries\)(, .*)?'
- extendedWaitUntil: { visible: '(?s)(.*, )?Next:.*(, .*)?', timeout: 5000 }
- takeScreenshot: 04-recurring
