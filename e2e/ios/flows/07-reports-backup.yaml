appId: com.lekhawise.app
name: Reports and PDF, reconcile and statement, backup saved to Files and restored from Files, CSV
---
- runFlow: common/fresh-start.yaml

- runFlow: { file: common/open.yaml, env: { PATH_TO: "transaction/new" } }
- extendedWaitUntil: { visible: '(?s)(.*, )?Scan a receipt(, .*)?', timeout: 30000 }
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Income(, .*)?' } }
- tapOn: '(?s)(.*, )?Income(, .*)?'
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Amount(, .*)?' } }
- tapOn: '(?s)(.*, )?Amount(, .*)?'
- waitForAnimationToEnd: { timeout: 2000 }
- inputText: "1000"
- runFlow: common/no-keyboard.yaml
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Category(, .*)?' } }
- tapOn: '(?s)(.*, )?Category(, .*)?'
- scrollUntilVisible: { element: '(?s)(.*, )?Salary(, .*)?' }
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: '(?s)(.*, )?Salary(, .*)?'
- scrollUntilVisible: { element: '(?s)(.*, )?Bank account(, .*)?' }
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: '(?s)(.*, )?Bank account(, .*)?'
- runFlow: common/save.yaml
- extendedWaitUntil: { notVisible: '(?s)(.*, )?(New|Edit) transaction(, .*)?', timeout: 20000 }
- runFlow: { file: common/open.yaml, env: { PATH_TO: "transaction/new" } }
- extendedWaitUntil: { visible: '(?s)(.*, )?Scan a receipt(, .*)?', timeout: 30000 }
- inputText: "250"
- runFlow: common/no-keyboard.yaml
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Category(, .*)?' } }
- tapOn: '(?s)(.*, )?Category(, .*)?'
- scrollUntilVisible: { element: '(?s)(.*, )?Food & dining(, .*)?' }
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: '(?s)(.*, )?Food & dining(, .*)?'
# Paid in cash (the form preselects the account used last, the bank)
- scrollUntilVisible: { element: '(?s)(.*, )?Cash(, .*)?' }
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: '(?s)(.*, )?Cash(, .*)?'
- runFlow: common/save.yaml
- extendedWaitUntil: { notVisible: '(?s)(.*, )?(New|Edit) transaction(, .*)?', timeout: 20000 }

# Reports for the month and the financial year; the PDF opens the share sheet
- runFlow: { file: common/open.yaml, env: { PATH_TO: "reports" } }
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Expenses by category(, .*)?' } }
- runFlow: { file: common/find-above.yaml, env: { TEXT: '(?s)(.*, )?75%(, .*)?' } } # savings rate, at the top
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Financial year(, .*)?' } }
- tapOn: '(?s)(.*, )?Financial year(, .*)?'
- extendedWaitUntil: { visible: '(?s)(.*, )?FY .*(, .*)?', timeout: 5000 }
- takeScreenshot: 07-reports-year
- scrollUntilVisible: { element: '(?s)(.*, )?Share PDF(, .*)?' }
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: '(?s)(.*, )?Share PDF(, .*)?'
- extendedWaitUntil: { visible: '(?s)(.*, )?Save to Files(, .*)?', timeout: 30000 }
- takeScreenshot: 07-report-pdf-share-sheet
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Close(, .*)?' } }
- tapOn: '(?s)(.*, )?Close(, .*)?'

# Reconcile cash to -300 (it shows -250): an adjustment of -50 is recorded; then the statement
- runFlow: { file: common/open.yaml, env: { PATH_TO: "account/acc_cash" } }
- extendedWaitUntil: { visible: '(?s)(.*, )?Reconcile(, .*)?', timeout: 10000 }
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Reconcile(, .*)?' } }
- tapOn: '(?s)(.*, )?Reconcile(, .*)?'
- extendedWaitUntil: { visible: '(?s)(.*, )?Reconcile Cash(, .*)?', timeout: 5000 }
- eraseText: 12
- inputText: "-300"
- tapOn: { text: "Reconcile", index: 1 }
- extendedWaitUntil: { visible: '(?s)(.*, )?Reconciled(, .*)?', timeout: 5000 }
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?A balance adjustment of -\$50\.00 was recorded so the account matches\.(, .*)?' } }
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?OK(, .*)?' } }
- tapOn: '(?s)(.*, )?OK(, .*)?'
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Statement(, .*)?' } }
- tapOn: '(?s)(.*, )?Statement(, .*)?'
- extendedWaitUntil: { visible: '(?s)(.*, )?Closing balance on.*(, .*)?', timeout: 10000 }
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?-\$300\.00(, .*)?' } }
- takeScreenshot: 07-statement
- scrollUntilVisible: { element: '(?s)(.*, )?Share PDF(, .*)?' }
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: '(?s)(.*, )?Share PDF(, .*)?'
- extendedWaitUntil: { visible: '(?s)(.*, )?Save to Files(, .*)?', timeout: 30000 }
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Close(, .*)?' } }
- tapOn: '(?s)(.*, )?Close(, .*)?'

# Backup saved to Files on the phone
- runFlow: { file: common/open.yaml, env: { PATH_TO: "backup" } }
- extendedWaitUntil: { visible: '(?s)(.*, )?No backup made yet\.(, .*)?', timeout: 10000 }
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Create backup file(, .*)?' } }
- tapOn: '(?s)(.*, )?Create backup file(, .*)?'
- extendedWaitUntil: { visible: '(?s)(.*, )?Save to Files(, .*)?', timeout: 30000 }
- takeScreenshot: 07-backup-share-sheet
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Save to Files(, .*)?' } }
- tapOn: '(?s)(.*, )?Save to Files(, .*)?'
- waitForAnimationToEnd: { timeout: 5000 }
- takeScreenshot: 07-files-save
- runFlow:
    when:
      visible: '(?s)(.*, )?On My iPhone(, .*)?'
    commands:
      - runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?On My iPhone(, .*)?' } }
      - tapOn: '(?s)(.*, )?On My iPhone(, .*)?'
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Save(, .*)?' } }
- tapOn: '(?s)(.*, )?Save(, .*)?'
- runFlow:
    when:
      visible: '(?s)(.*, )?Replace(, .*)?'
    commands:
      - runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Replace(, .*)?' } }
      - tapOn: '(?s)(.*, )?Replace(, .*)?'
- extendedWaitUntil: { visible: '(?s)(.*, )?Last backup file created: .*(, .*)?', timeout: 10000 }

# More data after the backup ...
- runFlow: { file: common/open.yaml, env: { PATH_TO: "transaction/new" } }
- extendedWaitUntil: { visible: '(?s)(.*, )?Scan a receipt(, .*)?', timeout: 30000 }
- inputText: "222"
- runFlow: common/no-keyboard.yaml
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Category(, .*)?' } }
- tapOn: '(?s)(.*, )?Category(, .*)?'
- scrollUntilVisible: { element: '(?s)(.*, )?Shopping(, .*)?' }
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: '(?s)(.*, )?Shopping(, .*)?'
- scrollUntilVisible: { element: '(?s)(.*, )?Optional(, .*)?' }
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: '(?s)(.*, )?Optional(, .*)?'
- waitForAnimationToEnd: { timeout: 2000 }
- inputText: "Shoes"
- runFlow: common/save.yaml
- extendedWaitUntil: { notVisible: '(?s)(.*, )?(New|Edit) transaction(, .*)?', timeout: 20000 }
- runFlow: { file: common/open.yaml, env: { PATH_TO: "transactions" } }
- extendedWaitUntil: { visible: '(?s)(.*, )?4 entries(, .*)?', timeout: 10000 }

# ... is gone again after restoring the backup picked from Files
- runFlow: { file: common/open.yaml, env: { PATH_TO: "backup" } }
- scrollUntilVisible: { element: '(?s)(.*, )?Choose backup file(, .*)?' }
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: '(?s)(.*, )?Choose backup file(, .*)?'
- waitForAnimationToEnd: { timeout: 5000 }
- takeScreenshot: 07-file-picker
- runFlow:
    when:
      notVisible: '(?s)(.*, )?lekhawise-backup.*(, .*)?'
    commands:
      - tapOn: { text: '(?s)(.*, )?Browse(, .*)?', optional: true }
      - tapOn: { text: '(?s)(.*, )?On My iPhone(, .*)?', optional: true }
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?lekhawise-backup.*(, .*)?' } }
- tapOn: '(?s)(.*, )?lekhawise-backup.*(, .*)?'
- extendedWaitUntil: { visible: '(?s)(.*, )?Restore this backup(, .*)?', timeout: 10000 }
- takeScreenshot: 07-restore-preview
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Restore this backup(, .*)?' } }
- tapOn: '(?s)(.*, )?Restore this backup(, .*)?'
- extendedWaitUntil: { visible: '(?s)(.*, )?Replace all data\?(, .*)?', timeout: 5000 }
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Replace(, .*)?' } }
- tapOn: '(?s)(.*, )?Replace(, .*)?'
- extendedWaitUntil: { visible: '(?s)(.*, )?Restored(, .*)?', timeout: 10000 }
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?OK(, .*)?' } }
- tapOn: '(?s)(.*, )?OK(, .*)?'
- runFlow: { file: common/open.yaml, env: { PATH_TO: "transactions" } }
- extendedWaitUntil: { visible: '(?s)(.*, )?3 entries(, .*)?', timeout: 10000 }
- assertNotVisible: ".*Shoes.*"
- takeScreenshot: 07-after-restore

# CSV export opens the share sheet
- runFlow: { file: common/open.yaml, env: { PATH_TO: "backup" } }
- scrollUntilVisible: { element: '(?s)(.*, )?Share CSV(, .*)?' }
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: '(?s)(.*, )?Share CSV(, .*)?'
- extendedWaitUntil: { visible: '(?s)(.*, )?Save to Files(, .*)?', timeout: 30000 }
- takeScreenshot: 07-csv-share-sheet
- runFlow: { file: common/find.yaml, env: { TEXT: '(?s)(.*, )?Close(, .*)?' } }
- tapOn: '(?s)(.*, )?Close(, .*)?'
