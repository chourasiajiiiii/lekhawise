name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Types, lint and tests
        run: npm run check
      - name: Hindi translation complete
        run: npm run i18n:check
      - name: Expo dependency check
        run: npx expo-doctor
